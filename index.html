<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#071C3C" />
  <meta name="description" content="CricTrack - Premium cricket team, tournament and live scoring platform" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CricTrack" />
  <title>CricTrack</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./ui-foundation.css" />


  <style>
    html,body{margin:0;background:#010817}
    #ctVideoIntro{position:fixed;inset:0;z-index:2147483647;background:#010817;overflow:hidden;opacity:1;transition:opacity .32s ease;display:flex;align-items:center;justify-content:center}
    #ctVideoIntro.is-closing{opacity:0;pointer-events:none}
    #ctIntroVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;background:#010817}
    #ctVideoIntro::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 52px rgba(0,16,55,.24)}
    #ctIntroSkip{position:absolute;z-index:5;right:18.5%;bottom:6.7%;min-width:72px;height:44px;padding:0 18px;border:1px solid rgba(255,255,255,.78);border-radius:999px;background:linear-gradient(180deg,#ff3b45 0%,#d51420 100%);color:#fff;font:800 13px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.08em;box-shadow:0 8px 24px rgba(214,20,32,.36),inset 0 1px 0 rgba(255,255,255,.25);text-shadow:0 1px 1px rgba(0,0,0,.22);cursor:pointer}
    #ctIntroSkip:active{transform:scale(.96)}
    @media (max-width:420px){#ctIntroSkip{right:17.5%;bottom:6.4%;min-width:68px;height:42px;padding:0 16px;font-size:12px}}
  </style>
</head>
<body>
  <div id="ctVideoIntro" aria-hidden="true">
    <video id="ctIntroVideo" autoplay muted playsinline preload="auto">
      <source src="./crictrack-intro.mp4?v=421" type="video/mp4" />
    </video>
    <button id="ctIntroSkip" type="button" aria-label="Skip intro">SKIP</button>
  </div>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>

</body>
</html>
