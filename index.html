<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#071C3C" />
  <meta name="description" content="CricTrack - Premium cricket team, tournament and live scoring platform" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CricTrack" />
  <title>CricTrack</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./ui-foundation.css" />


  <style>
    html,body{margin:0;background:#010817}
    #ctVideoIntro{position:fixed;inset:0;z-index:2147483647;background:#010817;overflow:hidden;opacity:1;transition:opacity .38s ease;display:flex;align-items:center;justify-content:center}
    #ctVideoIntro.is-closing{opacity:0;pointer-events:none}
    #ctIntroVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;background:#010817}
    #ctVideoIntro::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 42px rgba(0,20,65,.22)}
  </style>

</head>
<body>
  <div id="ctVideoIntro" aria-hidden="true">
    <video id="ctIntroVideo" autoplay muted playsinline preload="auto">
      <source src="./crictrack-intro.mp4?v=404" type="video/mp4" />
    </video>
  </div>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>

</body>
</html>
