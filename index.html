<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#071C3C" />
  <meta name="description" content="CricTrack - Premium cricket team, tournament and live scoring platform" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CricTrack" />
  <title>CricTrack</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preload" as="video" href="./crictrack-intro.mp4?v=422" type="video/mp4" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./ui-foundation.css" />


  <style>
    html,body{margin:0;background:#010817}
    #ctVideoIntro{position:fixed;inset:0;z-index:2147483647;background:#010817;overflow:hidden;opacity:1;transition:opacity .28s ease;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
    #ctVideoIntro.is-closing{opacity:0;pointer-events:none}
    #ctIntroVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;background:#010817;opacity:0;transition:opacity .16s ease;will-change:opacity;transform:translateZ(0)}
    #ctVideoIntro::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,24,82,.05),rgba(0,67,180,.04));box-shadow:inset 0 0 60px rgba(0,19,66,.22)}
    #ctIntroSkip{position:absolute;z-index:8;right:7.8%;bottom:7.1%;width:62px;height:62px;padding:0;border:1px solid rgba(146,215,255,.9);border-radius:50%;background:radial-gradient(circle at 35% 25%,#43b8ff 0%,#1488ee 36%,#0757c8 72%,#043b93 100%);color:#fff;font:900 11px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.06em;box-shadow:0 0 10px rgba(52,176,255,.9),0 0 24px rgba(0,117,255,.72),0 10px 28px rgba(0,42,130,.38),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 0 5px rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.35);cursor:pointer;transform:translateZ(0)}
    #ctIntroSkip:active{transform:scale(.94)}
    @media (max-width:420px){#ctIntroSkip{right:7.2%;bottom:7%;width:58px;height:58px;font-size:10px}}
  </style>
</head>
<body>
  <div id="ctVideoIntro" aria-hidden="true">
    <video id="ctIntroVideo" autoplay playsinline preload="auto">
      <source src="./crictrack-intro.mp4?v=422" type="video/mp4" />
    </video>
    <button id="ctIntroSkip" type="button" aria-label="Skip intro">SKIP</button>
  </div>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>

</body>
</html>
