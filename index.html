<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2E6D"><title>CricTrack</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0E1B33;background:#F5F8FD}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:linear-gradient(180deg,#edf4ff 0%,#f7f9fc 38%,#fff 100%)}button,input{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh;display:flex;flex-direction:column}.hero{background:linear-gradient(135deg,#0B2E6D,#123F8C 62%,#E53935 160%);color:#fff;padding:28px 20px 36px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(11,46,109,.18)}.brand-row{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}.logo-mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);font-size:28px}.brand-title{margin:0;font-size:30px;line-height:1;letter-spacing:-.6px}.brand-subtitle{margin:8px 0 0;opacity:.83;font-size:14px}.content{width:min(760px,100%);margin:0 auto;padding:24px 18px 32px}.section-title{margin:0 0 6px;font-size:20px}.section-copy{margin:0 0 18px;color:#667085;font-size:14px}.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:none;text-align:left;background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 26px rgba(25,52,93,.08);border:1px solid #e6ebf2;min-height:145px;position:relative;overflow:hidden}.card-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#edf4ff;font-size:24px;margin-bottom:16px}.card-title{font-weight:800;font-size:17px;color:#0B2E6D}.card-copy{margin-top:6px;color:#667085;font-size:13px;line-height:1.35}.super-admin{margin-top:16px;width:100%;background:#0E1B33;color:#fff;border:none;border-radius:14px;padding:13px 16px;font-weight:700}.super-admin span{color:#ff6b67}.footer{margin-top:auto;text-align:center;padding:18px;color:#8a94a6;font-size:12px}.login-wrap{width:min(520px,100%);margin:0 auto;padding:24px 18px 40px}.back{border:none;background:transparent;color:#0B2E6D;font-weight:700;padding:0 0 16px}.login-card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 12px 30px rgba(25,52,93,.09);border:1px solid #e5eaf1}.login-badge{display:inline-flex;background:#edf4ff;color:#0B2E6D;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800}.login-title{margin:18px 0 5px;font-size:26px}.login-copy{margin:0 0 20px;color:#667085;font-size:14px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#344054}.field input{width:100%;border:1px solid #cfd8e6;border-radius:13px;padding:13px 14px;outline:none;background:#fbfcfe}.remember{display:flex;align-items:center;gap:8px;margin:8px 0 18px;color:#667085;font-size:13px}.login-btn{width:100%;border:none;border-radius:14px;padding:14px;background:linear-gradient(135deg,#0B2E6D,#123F8C);color:#fff;font-weight:800}.note{margin-top:14px;border-left:3px solid #E53935;padding:9px 10px;background:#fff6f6;color:#7a2a29;font-size:12px;border-radius:8px}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.card{min-height:138px;padding:15px}}
</style></head><body><div id="app"></div><script>
const roles={team:{title:'Cricket Team Login',label:'Team ID',icon:'🛡️',placeholder:'Enter Team ID'},tournament:{title:'Tournament Login',label:'Tournament ID',icon:'🏆',placeholder:'Enter Tournament ID'},superadmin:{title:'Super Admin Login',label:'Admin ID / Email',icon:'🔐',placeholder:'Enter Admin ID'}};
const app=document.getElementById('app');
function header(sub='Teams • Tournaments • Live Scoring'){return `<header class="hero"><div class="brand-row"><div class="logo-mark">🏏</div><div><h1 class="brand-title">CricTrack</h1><p class="brand-subtitle">${sub}</p></div></div></header>`}
function home(){app.innerHTML=`<div class="app-shell">${header()}<main class="content"><h2 class="section-title">Welcome to CricTrack</h2><p class="section-copy">Choose your workspace to continue.</p><div class="grid"><button class="card" onclick="login('team')"><div class="card-icon">🛡️</div><div class="card-title">Cricket Team</div><div class="card-copy">Team login, players, matches and scoring.</div></button><button class="card" onclick="login('tournament')"><div class="card-icon">🏆</div><div class="card-title">Tournaments</div><div class="card-copy">Fixtures, live matches, points and results.</div></button></div><button class="super-admin" onclick="login('superadmin')"><span>●</span> Super Admin</button></main><footer class="footer">CricTrack v1.0.1 • Premium Cricket Platform</footer></div>`}
function login(role){const c=roles[role];app.innerHTML=`<div class="app-shell">${header('Secure access portal')}<main class="login-wrap"><button class="back" onclick="home()">← Back to Home</button><form class="login-card" onsubmit="event.preventDefault();alert('Phase 1 UI is ready. Firebase Authentication will be connected next.')"><div class="login-badge">${c.icon} &nbsp;Secure Login</div><h2 class="login-title">${c.title}</h2><p class="login-copy">Enter your CricTrack credentials to continue.</p><div class="field"><label>${c.label}</label><input autocomplete="username" placeholder="${c.placeholder}" required></div><div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Enter Password" required></div><label class="remember"><input type="checkbox" onchange="document.getElementById('pw').type=this.checked?'text':'password'"> Show password</label><button class="login-btn">Login</button><div class="note">Authentication is intentionally disabled in this first UI skeleton. Secure Firebase Auth comes next.</div></form></main></div>`}home();
</script></body></html>
