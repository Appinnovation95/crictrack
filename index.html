<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#071C3C" />
  <meta name="description" content="CricTrack - Premium cricket team, tournament and live scoring platform" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CricTrack" />
  <title>CricTrack</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./ui-foundation.css" />


  <style>
    html,body{margin:0;background:#010817}
    #ctSplashIntro{position:fixed;inset:0;z-index:2147483647;background:radial-gradient(circle at 50% 42%,#0d5dbf 0,#062f69 24%,#02152f 58%,#010817 100%);display:grid;place-items:center;opacity:1;transition:opacity .26s ease;overflow:hidden}
    #ctSplashIntro.is-closing{opacity:0;pointer-events:none}
    #ctSplashIntro::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle,#2a9cff33 0,transparent 48%);animation:ctGlow 1.8s ease-in-out infinite alternate}
    #ctSplashIcon{position:relative;width:min(42vw,190px);height:min(42vw,190px);object-fit:contain;border-radius:26%;filter:drop-shadow(0 0 18px #1c8fffaa) drop-shadow(0 0 42px #0a5fdc66);animation:ctIconIn .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes ctIconIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
    @keyframes ctGlow{from{transform:scale(.96);opacity:.65}to{transform:scale(1.06);opacity:1}}
  </style>
</head>
<body>
  <div id="ctSplashIntro" aria-hidden="true">
    <img id="ctSplashIcon" src="./icon-512.png" alt="" />
  </div>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>

</body>
</html>
